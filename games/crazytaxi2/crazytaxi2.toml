# Crazy Taxi 2, MK-51136 V1.004 (2001-05-02), USA
# Written by hand from Crazy Taxi's config (CTDC-nx) and ZombieRev-nx's template. Everything here
# is read off the disc or is the standard Katana layout; nothing from the disc is ever committed.

[game]
id = "crazytaxi2"
title = "Crazy Taxi 2"
region = "USA"
product = "MK-51136"

[disc]
image = "../../assets/Crazy Taxi 2 (USA).chd"

[binary]
path = "extracted/fs/1ST_READ.BIN"
load_address = 0x8C010000    # where the console's BIOS loads the file
link_address = 0x0C010000    # the same RAM through a different address; what the code assumes
entry = 0x8C010000           # the first instruction

# Code files besides 1ST_READ.BIN (dcdisc scan, 2026-11-06): 2_DP.BIN (2.8 MB, Ninja, Shinobi and
# Kamui banners: the bundled Dream Passport web browser for the online features), SG_DPLDR.BIN and
# MAIGO.BIN (14,856 bytes each, small loaders). None is configured: the browser is out of scope
# for an offline port, and a boot report shows any of them reached as untranslated calls far from
# the main program. FCV*.BIN, PPLDC*.BIN and the AFS archives are data.

# Addresses discovery does not reach, and regions the program copies and runs elsewhere, both go
# here. Run the launcher with --suggest-config FILE and it writes them for you.
[functions]
# Call targets the 2026-11-06 PC boot test (120 guest s, into gameplay) reached untranslated.
# The same functions as Crazy Taxi's first four seeds (CTDC-nx 0x0C081476, 0x0C081E56,
# 0x0C0854A0, 0x0C086B74), the first of the two byte matches in each case.
extra = [0x0C0814E6,  # 183,460 calls, the hottest code the run interpreted
         0x0C081E9A,  # 15,691
         0x0C088720,  # 625
         0x0C093CA4]  # 1

# Exception and interrupt stubs the startup copies below the program: VBR = 0x8C000000 here
# (Crazy Taxi's is 0x8C00F000), 0x000 from 0x0C166274 (called from 0x0C16658A on every
# interrupt), 0x100 and 0x400 copies of one stub, 0x600 the interrupt stub. Crazy Taxi's four
# stubs byte for byte, only their literal pointers into the program moved (0x0C16BF58 ->
# 0x0C1665B0, 0x0C16BC44 -> 0x0C1662A4). Each was interpreted 56,688 times in the first boot test
# (these relocations first went in at Crazy Taxi's addresses, unused). Stubs can patch their own
# literal pool, so every literal is read at run time (no_fold). Never give the 0x600 stub extra
# `entries`: in CTDC-nx that faulted at boot (switch-test3).
[[relocations]]
source = 0x0C166274
size = 0x34
dest = 0x8C000000
no_fold = true

[[relocations]]
source = 0x0C1661E0
size = 0x34
dest = 0x8C000100
no_fold = true

[[relocations]]
source = 0x0C1661E0
size = 0x34
dest = 0x8C000400
no_fold = true

[[relocations]]
source = 0x0C166218
size = 0x58
dest = 0x8C000600
no_fold = true

# Crazy Taxi also copies startup code to 0x8C004000 and 0x8C004E0C and small routines to
# 0x8C00EB90..0x8C00F0F4 and 0x8C00F720; the first boot test found no such copies in Crazy Taxi 2.
